allowBuilds:
  '@swc/core': false
  esbuild: false
  msw: false
patchedDependencies:
  # fix ast-types imports (required with "skipLibCheck": false)
  ast-types: patches/ast-types.patch
catalog:
  '@vitest/coverage-v8': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10
  vite-plus: 0.2.6
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@gmcode/forms'
  - '@gmcode/react-ui'
  - '@gmcode/tsv-core'
  - '@gmcode/tsv-hookform'
  - '@gmcode/tsv-input'
