allowBuilds:
  '@swc/core': false
  cypress: true
  esbuild: false
  msw: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: 4.1.10
  vite-plus: 0.2.7
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@gmcode/forms'
  - '@gmcode/react-ui'
  - '@gmcode/tsv-core'
  - '@gmcode/tsv-hookform'
  - '@gmcode/tsv-input'
sideEffectsCache: false
