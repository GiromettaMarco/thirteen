allowBuilds:
  '@swc/core': false
  cypress: false
  esbuild: false
  msw: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.3
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@gmcode/forms'
  - '@gmcode/react-ui'
  - '@gmcode/tsv-advanced'
  - '@gmcode/tsv-core'
  - '@gmcode/tsv-hookform'
  - '@gmcode/tsv-input'
sideEffectsCache: false
