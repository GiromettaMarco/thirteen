name: tests

on:
  push:
    branches:
      - 1.x
      - master
  pull_request:
    branches:
      - 1.x
      - master
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, dom, curl, libxml, mbstring
          tools: composer:v2
          coverage: xdebug

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node with cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup with Composer
        run: composer run-script setup

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: PHP Tests
        run: composer run-script test

      - name: Browser Tests
        run: composer run-script test:browser

      # - name: Update PHP Coverage Badge
      #   run: bin/php-coverage

