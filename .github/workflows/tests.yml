name: Tests

on:
  pull_request:
    branches:
      - 1.x
      - master
  push:
    branches:
      - 1.x
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, dom, curl, libxml, mbstring
          tools: composer:v2
          coverage: xdebug

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Setup with Composer
        run: composer run setup

      - name: Install Playwright Browsers
        run: vpx playwright install --with-deps chromium --only-shell

      - name: PHP Tests
        run: composer run test

      - name: Browser Tests
        run: composer run test:browser

      - name: Vitest
        run: vpr test

      - name: Update PHP Coverage Badge
        run: bin/php-coverage

      - name: Update TS Coverage Badge
        run: bin/ts-coverage

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: update coverage badges'
          commit_options: '--no-verify'

      - name: Store Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            tests/Browser/Screenshots/*.png
          retention-days: 7
