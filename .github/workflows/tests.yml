name: Tests

on:
  pull_request:
    branches:
      - 1.x
      - master
  push:
    branches:
      - 1.x
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI setup
        uses: ./.github/actions/vp-setup

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: json, dom, curl, libxml, mbstring
          tools: composer:v2
          coverage: xdebug

      - name: Setup with Composer
        run: composer run setup

      - name: Install Playwright Browsers
        run: vpx playwright install --with-deps chromium --only-shell

      - name: PHP Tests
        run: composer run test

      - name: Vitest
        run: vpr test

      - name: Update PHP Coverage Badge
        run: bin/php-coverage

      # - name: Update TS Coverage Badge
      #   run: bin/ts-coverage

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'docs: update coverage badges'
          commit_options: '--no-verify'

