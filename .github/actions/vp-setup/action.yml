name: Setup CI

description: Install Vite+ with node 24, enable cache and install dependencies.

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1
      with:
        node-version: '24'
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
