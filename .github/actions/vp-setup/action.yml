name: Setup CI

description: Install Vite+ with node 24, enable cache and install dependencies.

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
      with:
        node-version: '24'
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
